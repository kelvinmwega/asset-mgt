name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    services:
      postgres:
        # Keep this major in sync with docker-compose.yml and the Neon project.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asset_mgt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Enables the real-DB integration tests (skipIf pattern).
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asset_mgt_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Build runs with no app env populated — this is the standing proof of
      # the lazy-env rule (build must succeed with nothing configured).
      - run: pnpm build
      # Must follow the build: this probes the COMPILED middleware matcher in
      # .next/server/middleware-manifest.json, which does not exist at
      # `pnpm test` time. It is the negative control on the public-route gate —
      # brute-forcing the short path space to prove `/` is the only path that
      # bypasses authentication. Catches what a source-level assertion cannot:
      # a basePath being added, or Next changing how it compiles matchers.
      # T3 advisor condition 7, 2026-08-30.
      - run: pnpm matcher:probe
